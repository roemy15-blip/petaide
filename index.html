<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0f1117">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PetaIde">
<title>PetaIde</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#0f1117; --panel:#151823; --panel2:#1c2030; --border:#272d3f;
  --text:#e7e9f0; --muted:#8b93a7; --accent:#7c5cff; --accent2:#4dd4c0;
  --danger:#ff5c72; --shadow:0 10px 40px rgba(0,0,0,.5);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,sans-serif;
  background:var(--bg);color:var(--text);overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#2c3346;border-radius:8px}

/* SPLASH */
#splash{
  position:fixed;inset:0;z-index:1000;background:#0f1117;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  transition:opacity .35s ease, visibility .35s;
}
#splash.hide{opacity:0;visibility:hidden}
#splash .ico{font-size:80px;line-height:1;animation:pop .5s ease}
#splash .nm{font-size:19px;font-weight:700;letter-spacing:.3px}
#splash .sub{font-size:12px;color:var(--muted)}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}

/* LAYOUT */
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}

/* SIDEBAR */
.sidebar{
  width:300px;flex:0 0 300px;background:var(--panel);border-right:1px solid var(--border);
  display:flex;flex-direction:column;min-width:0;transition:margin-left .25s;
  padding-top:var(--safe-t);
}
.brand{display:flex;align-items:center;gap:10px;padding:16px 16px 10px}
.brand .lg{
  width:36px;height:36px;border-radius:10px;
  background:linear-gradient(135deg,#7c5cff,#4dd4c0);
  display:grid;place-items:center;font-size:19px;flex:0 0 auto;
}
.brand h1{font-size:16px;margin:0;font-weight:700}
.brand small{display:block;font-size:11px;color:var(--muted);margin-top:1px}
.new-btns{display:flex;gap:8px;padding:0 12px 12px}
.new-btns button{
  flex:1;padding:11px 8px;border-radius:10px;border:1px solid var(--border);
  background:var(--panel2);font-size:12.5px;font-weight:600;color:var(--text);
  display:flex;align-items:center;justify-content:center;gap:5px;transition:.15s;
}
.new-btns button.pri{background:linear-gradient(135deg,#7c5cff,#6a4be0);border-color:transparent}
.new-btns button:active{transform:scale(.96)}
.search-wrap{padding:0 12px 10px}
.search-wrap input{
  width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);
  background:#11141d;color:var(--text);font-size:13px;outline:none;font-family:inherit;
}
.search-wrap input:focus{border-color:var(--accent)}
.list{flex:1;overflow-y:auto;padding:0 8px 8px;-webkit-overflow-scrolling:touch}
.sec{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:var(--muted);
  padding:12px 10px 6px;font-weight:700}
.item{
  display:flex;align-items:center;gap:10px;padding:11px 10px;border-radius:10px;
  cursor:pointer;margin-bottom:2px;transition:.12s;border:1px solid transparent;
}
.item:active{background:var(--panel2)}
.item.active{background:#232a3f;border-color:#38405c}
.item .ic{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;
  font-size:15px;flex:0 0 auto;background:#242a3c}
.item[data-type="mindmap"] .ic{background:linear-gradient(135deg,#3a2f78,#2b3f6b)}
.item .mt{flex:1;min-width:0}
.item .mt .t{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.item .mt .d{font-size:10.5px;color:var(--muted);margin-top:2px}
.item .dl{opacity:0;font-size:15px;color:var(--muted);padding:6px 8px;border-radius:8px;
  transition:.15s}
.item:active .dl{opacity:.6}
.item .dl:active{color:var(--danger)}
.empty-list{text-align:center;color:var(--muted);font-size:12.5px;padding:40px 20px;line-height:1.7}
.side-foot{padding:10px 12px calc(14px + var(--safe-b));border-top:1px solid var(--border);
  display:flex;gap:8px}
.side-foot button{flex:1;padding:10px;border-radius:9px;border:1px solid var(--border);
  background:transparent;color:var(--muted);font-size:11.5px;font-weight:600;transition:.15s}
.side-foot button:active{color:var(--text);border-color:var(--accent)}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg);position:relative}
.topbar{
  height:calc(56px + var(--safe-t));padding-top:var(--safe-t);
  border-bottom:1px solid var(--border);background:var(--panel);
  display:flex;align-items:center;gap:8px;padding-left:12px;padding-right:12px;
}
.hamburger{display:none;font-size:22px;padding:8px;border-radius:9px}
.hamburger:active{background:var(--panel2)}
.title-input{
  flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text);
  font-size:15px;font-weight:650;font-family:inherit;padding:8px 10px;border-radius:9px;
}
.title-input:focus{background:#1a1e2b}
.top-actions{display:flex;gap:6px}
.btn{
  padding:9px 13px;border-radius:9px;border:1px solid var(--border);background:var(--panel2);
  color:var(--text);font-size:12.5px;font-weight:600;transition:.15s;white-space:nowrap;
  display:inline-flex;align-items:center;gap:6px;
}
.btn:active{transform:scale(.95)}
.btn.pri{background:linear-gradient(135deg,#7c5cff,#6a4be0);border-color:transparent}
.btn.sm{padding:7px 10px;font-size:12px}
.btn.save{background:#1f4d47;border-color:#2d6b62;color:#c2f5ec}

.workspace{flex:1;position:relative;overflow:hidden}

/* EMPTY */
.empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;text-align:center;padding:30px;
}
.empty .big{font-size:56px;opacity:.9}
.empty h2{margin:0;font-size:19px}
.empty p{margin:0;color:var(--muted);font-size:13.5px;max-width:400px;line-height:1.7}

/* VIEW */
.view{position:absolute;inset:0;display:none;flex-direction:column}
.view.on{display:flex}

/* MINDMAP */
.mm-toolbar{
  display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);
  background:var(--panel);overflow-x:auto;flex-wrap:nowrap;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.mm-toolbar::-webkit-scrollbar{display:none}
.mm-toolbar .sep{width:1px;height:22px;background:var(--border);flex:0 0 auto;margin:0 3px}
.mm-toolbar .btn{flex:0 0 auto}
.mm-viewport{
  flex:1;position:relative;overflow:hidden;touch-action:none;
  background-color:#0e1017;
  background-image:radial-gradient(circle,#1c2130 1px,transparent 1px);
  background-size:22px 22px;
}
.mm-canvas{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
#mmEdges{position:absolute;overflow:visible;pointer-events:none}
#mmNodes{position:absolute;top:0;left:0}
.mm-node{
  position:absolute;max-width:min(230px, 62vw);padding:10px 14px;border-radius:12px;
  background:var(--panel2);border:1.5px solid #39415a;color:var(--text);
  font-size:13.5px;font-weight:550;line-height:1.35;cursor:pointer;
  box-shadow:0 4px 16px rgba(0,0,0,.4);
  word-wrap:break-word;touch-action:none;
}
.mm-node.root{background:linear-gradient(135deg,#3a2f78,#2f3a6b);
  border-color:#5f52c9;font-weight:700;font-size:14px}
.mm-node.tapped{box-shadow:0 0 0 3px rgba(124,92,255,.4),0 6px 24px rgba(0,0,0,.5)}
.mm-node .badge{
  position:absolute;top:-6px;right:-6px;
  background:var(--accent2);color:#0b1a17;font-size:9px;font-weight:800;
  padding:2px 6px;border-radius:8px;line-height:1.4;
}
.mm-hint{
  position:absolute;bottom:12px;left:12px;right:12px;
  font-size:10.5px;color:var(--muted);
  background:rgba(15,17,23,.85);padding:7px 11px;border-radius:9px;
  border:1px solid var(--border);backdrop-filter:blur(6px);
  pointer-events:none;text-align:center;line-height:1.5;
}
.zoom-badge{
  position:absolute;bottom:12px;right:12px;font-size:11px;color:var(--muted);
  background:rgba(15,17,23,.85);padding:6px 11px;border-radius:9px;
  border:1px solid var(--border);backdrop-filter:blur(6px);pointer-events:none;
  display:none;
}
@media(min-width:880px){.zoom-badge{display:block}}

/* NODE POPUP */
.pop-bg{
  position:fixed;inset:0;background:rgba(6,8,14,.72);backdrop-filter:blur(6px);
  z-index:150;display:flex;align-items:center;justify-content:center;
  padding:16px;padding-top:calc(16px + var(--safe-t));
  padding-bottom:calc(16px + var(--safe-b));
}
.pop{
  background:var(--panel);border:1px solid var(--border);border-radius:18px;
  width:100%;max-width:520px;max-height:100%;
  display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 20px 60px rgba(0,0,0,.6);
  will-change:transform,opacity;
}
.pop-head{
  display:flex;align-items:center;gap:10px;
  padding:14px 14px 12px 16px;border-bottom:1px solid var(--border);
  background:var(--panel);flex:0 0 auto;
}
.pop-head input{
  flex:1;min-width:0;background:transparent;border:none;outline:none;
  color:var(--text);font-size:16px;font-weight:700;font-family:inherit;
  padding:4px 0;
}
.pop-head input::placeholder{color:#4e5568}
.pop-close{
  width:36px;height:36px;border-radius:10px;background:var(--panel2);
  color:var(--muted);font-size:16px;flex:0 0 auto;
  display:grid;place-items:center;transition:.15s;
}
.pop-close:active{background:#2a3147;color:var(--text)}
.pop-body{
  flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:16px;padding-bottom:calc(16px + var(--safe-b));
}
.pop-content{
  min-height:120px;outline:none;font-size:14.5px;line-height:1.7;
  color:var(--text);white-space:pre-wrap;word-wrap:break-word;
}
.pop-content:empty::before{content:attr(data-ph);color:#4e5568;pointer-events:none}
.pop-actions{
  display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--border);
  background:var(--panel);flex:0 0 auto;justify-content:space-between;
}
.pop-actions .left{display:flex;gap:8px}
.pop-actions button{font-size:12px;padding:8px 12px;border-radius:8px;
  background:var(--panel2);border:1px solid var(--border);color:var(--text);font-weight:600}
.pop-actions .del{color:var(--danger)}

/* NOTE */
.note-toolbar{
  display:flex;gap:2px;align-items:center;padding:7px 8px;
  border-bottom:1px solid var(--border);background:var(--panel);
  overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.note-toolbar::-webkit-scrollbar{display:none}
.note-toolbar button{
  min-width:38px;height:38px;padding:0 8px;border-radius:8px;
  color:var(--text);font-size:14px;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;
  flex:0 0 auto;transition:.13s;background:transparent;
}
.note-toolbar button:active{background:var(--panel2)}
.note-toolbar .sep{width:1px;height:22px;background:var(--border);flex:0 0 auto;margin:0 4px}
.note-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg)}
#noteEditor{
  max-width:820px;margin:0 auto;
  padding:24px 20px calc(120px + var(--safe-b));
  outline:none;font-size:15.5px;line-height:1.75;min-height:100%;
}
#noteEditor:empty::before{content:attr(data-ph);color:#4e5568;pointer-events:none}
#noteEditor h1{font-size:24px;margin:.7em 0 .4em;font-weight:750}
#noteEditor h2{font-size:20px;margin:.8em 0 .4em;font-weight:700}
#noteEditor h3{font-size:17px;margin:.9em 0 .4em;font-weight:700}
#noteEditor p{margin:.5em 0}
#noteEditor ul,#noteEditor ol{padding-left:24px;margin:.5em 0}
#noteEditor li{margin:.25em 0}
#noteEditor blockquote{border-left:3px solid var(--accent);margin:.8em 0;
  padding:6px 14px;color:#b9c0d4;background:rgba(124,92,255,.06);border-radius:0 8px 8px 0}
#noteEditor img{max-width:100%;border-radius:10px;margin:10px 0;display:block}
#noteEditor a{color:var(--accent2)}
#noteEditor code{background:#1c2130;padding:2px 6px;border-radius:5px;font-size:.9em;
  font-family:ui-monospace,Menlo,monospace}
#noteEditor pre{background:#151925;padding:14px;border-radius:10px;overflow-x:auto;
  border:1px solid var(--border)}
#noteEditor pre code{background:none;padding:0}
#noteEditor hr{border:none;border-top:1px solid var(--border);margin:1.5em 0}

/* SCROLL TOP BUTTON */
.scroll-top{
  position:fixed;bottom:20px;right:16px;
  width:44px;height:44px;border-radius:50%;
  background:linear-gradient(135deg,#7c5cff,#6a4be0);color:#fff;
  font-size:18px;display:grid;place-items:center;
  box-shadow:0 8px 24px rgba(124,92,255,.4);
  opacity:0;pointer-events:none;transition:.25s;z-index:80;
}
.scroll-top.on{opacity:1;pointer-events:auto}

/* MODAL */
.modal-bg{
  position:fixed;inset:0;background:rgba(6,8,14,.75);backdrop-filter:blur(4px);
  display:none;align-items:center;justify-content:center;z-index:200;padding:20px;
}
.modal-bg.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--border);border-radius:16px;
  padding:20px;width:100%;max-width:400px;box-shadow:var(--shadow);
  max-height:85vh;overflow-y:auto}
.modal h3{margin:0 0 6px;font-size:16px}
.modal p{margin:0 0 16px;font-size:13px;color:var(--muted);line-height:1.6}
.modal .row{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}

/* TOAST */
.toast{
  position:fixed;bottom:calc(24px + var(--safe-b));left:50%;
  transform:translate(-50%,80px);
  background:#232a3f;border:1px solid #3a4460;color:var(--text);
  padding:11px 18px;border-radius:11px;font-size:13px;font-weight:600;
  box-shadow:var(--shadow);opacity:0;transition:.3s;z-index:300;
  pointer-events:none;max-width:90vw;text-align:center;
}
.toast.on{transform:translate(-50%,0);opacity:1}

.scrim{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90}
.scrim.on{display:block}

/* MOBILE */
@media(max-width:880px){
  .sidebar{position:fixed;top:0;bottom:0;left:0;z-index:100;
    margin-left:-300px;box-shadow:var(--shadow)}
  .sidebar.open{margin-left:0}
  .hamburger{display:grid}
  .top-actions .btn .lbl{display:none}
  .top-actions .btn{padding:8px 11px}
}

/* PRINT */
@media print{
  body{background:#fff;color:#111}
  .sidebar,.topbar,.note-toolbar,.scroll-top,.toast,.pop-bg{display:none !important}
  .main{background:#fff}
  #noteEditor{padding:20px;color:#111}
}
</style>
</head>
<body>

<!-- SPLASH -->
<div id="splash">
  <div class="ico">📄</div>
  <div class="nm">PetaIde</div>
  <div class="sub">memuat…</div>
</div>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="lg">📄</div>
      <div><h1>PetaIde</h1><small>Catatan & Peta Pikiran</small></div>
    </div>
    <div class="new-btns">
      <button class="pri" id="newMap">＋ Peta</button>
      <button id="newNote">＋ Catatan</button>
    </div>
    <div class="search-wrap">
      <input id="search" placeholder="🔍  Cari…" autocomplete="off">
    </div>
    <div class="list" id="list"></div>
    <div class="side-foot">
      <button id="exportAll">⬇ Ekspor</button>
      <button id="importAll">⬆ Impor</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger">☰</button>
      <input class="title-input" id="titleInput" placeholder="Judul…" disabled>
      <div class="top-actions" id="topActions"></div>
    </header>
    <div class="workspace" id="workspace">

      <div class="empty" id="emptyState">
        <div class="big">✨</div>
        <h2>Mulai tuangkan idemu</h2>
        <p>Buat <b>Peta Pikiran</b> untuk memetakan gagasan bercabang, atau <b>Catatan</b> untuk menulis bebas.</p>
        <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
          <button class="btn pri" id="emptyNewMap">🧠 Peta Pikiran</button>
          <button class="btn" id="emptyNewNote">📝 Catatan</button>
        </div>
      </div>

      <div class="view" id="mmView">
        <div class="mm-toolbar">
          <button class="btn sm pri" id="mmAddChild">＋ Cabang</button>
          <button class="btn sm" id="mmAddSibling">＋ Sejajar</button>
          <div class="sep"></div>
          <button class="btn sm" id="mmLayout">🪄 Tata</button>
          <button class="btn sm" id="mmFit">🎯 Pusat</button>
          <div class="sep"></div>
          <button class="btn sm" id="mmZoomOut">－</button>
          <button class="btn sm" id="mmZoomIn">＋</button>
          <div class="sep"></div>
          <button class="btn sm" id="mmExportPng">🖼 PNG</button>
        </div>
        <div class="mm-viewport" id="mmViewport">
          <div class="mm-canvas" id="mmCanvas">
            <svg id="mmEdges"></svg>
            <div id="mmNodes"></div>
          </div>
          <div class="mm-hint">Tap simpul untuk buka isi · Tahan &amp; geser untuk memindah · Cubit untuk zoom</div>
          <div class="zoom-badge" id="zoomBadge">100%</div>
        </div>
      </div>

      <div class="view" id="noteView">
        <div class="note-toolbar" id="noteToolbar">
          <button data-cmd="bold"><b>B</b></button>
          <button data-cmd="italic"><i>I</i></button>
          <button data-cmd="underline"><u>U</u></button>
          <button data-cmd="strikeThrough"><s>S</s></button>
          <div class="sep"></div>
          <button data-block="h1">H1</button>
          <button data-block="h2">H2</button>
          <button data-block="h3">H3</button>
          <button data-block="p">¶</button>
          <div class="sep"></div>
          <button data-cmd="insertUnorderedList">•</button>
          <button data-cmd="insertOrderedList">1.</button>
          <button data-block="blockquote">❝</button>
          <div class="sep"></div>
          <button id="insertImg">🖼</button>
          <button id="insertLink">🔗</button>
          <button data-cmd="insertHorizontalRule">―</button>
          <div class="sep"></div>
          <button id="clearFmt">🧹</button>
        </div>
        <div class="note-scroll">
          <div id="noteEditor" contenteditable="true" data-ph="Mulai menulis…"></div>
        </div>
      </div>

    </div>
  </main>
</div>

<button class="scroll-top" id="scrollTop">↑</button>
<div class="scrim" id="scrim"></div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <h3 id="modalTitle">Ekspor</h3>
    <p id="modalDesc"></p>
    <div id="modalBody"></div>
    <div class="row" id="modalRow"></div>
  </div>
</div>

<input type="file" id="filePick" accept="image/*" hidden>
<input type="file" id="jsonPick" accept=".json,application/json" hidden>

<div class="toast" id="toast"></div>

<script>
/* =========================================================
   STATE
   ========================================================= */
const LS_KEY='petaide_v2';
let state={items:[],activeId:null};
let selectedNodeId=null;
let mmView={x:40,y:40,scale:1};
let currentNoteId=null;
let noteSaveTimer=null;

const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const save=()=>{try{localStorage.setItem(LS_KEY,JSON.stringify(state));}catch(e){toast('⚠️ Penyimpanan penuh');}};
const load=()=>{try{const r=localStorage.getItem(LS_KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.items))state=d;}}catch(e){}};
const getActive=()=>state.items.find(i=>i.id===state.activeId)||null;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* =========================================================
   UTIL
   ========================================================= */
function t
